  <body>
    <header class="header">
  <div class="container">
    <nav class="nav">
      <a class="nav-logo" href="./index.html" aria-label="Site logo">
        <svg class="nav-logo-icon" width="100" height="30">
          <use href="/prime-force/assets/sprite-B0IVO1z0.svg#logo"></use>
        </svg>
      </a>
      <ul class="nav-list">
        <li class="nav-item">
          <a class="nav-link {=$highlight-act}" href="./page-2.html"
            >Успіхів!</a
          >

        <li class="nav-item">
          <a class="nav-link {=$highlight-curr}" href="./page-3.html">Page 3</a>
        </li>
      </ul>
    </nav>

</header>


    <main>
      <!-- Loads the specified .html file -->
      
      
      
      
      
      
      <div class="modal-overlay is-open" id="order-modal">
  <div class="modal">
    <button class="modal-close-btn" type="button" data-modal-close>
      <svg class="modal-close-icon" width="24" height="24">
        <use href="/prime-force/assets/sprite-B0IVO1z0.svg#icon-close"></use>
      </svg>
    </button>
    <h3 class="modal-title bold">Залишіть заявку на знайомство</h3>
    <form>
      <div class="input-group">
        <label for="username-basic" class="modal-label regular">Ім’я*</label>
        <div class="input-container">
          <input
            type="text"
            name="Name"
            id="username-basic"
            class="modal-input"
            placeholder="Андрій"
          />
        </div>
      </div>
      <div class="input-group">
        <label for="phone-basic" class="modal-label regular">Телефон*</label>
        <div class="input-container">
          <input
            type="tel"
            name="Phone"
            id="phone-basic"
            class="modal-input"
            placeholder="380955559922"
          />
        </div>
      </div>
      <div class="input-group-row">
        <div class="input-group">
          <label for="comment-basic" class="modal-label regular"
            >Коментар</label
          >
          <div class="input-container">
            <textarea
              id="comment-basic"
              name="comment"
              rows="5"
              cols="30"
              class="modal-input"
              placeholder="Напишіть ваш коментар"
            ></textarea>
          </div>
        </div>
      </div>
      <button type="submit" class="modal-submit-btn regular">Надіслати</button>
    </form>
  </div>
</div>

    </main>

    

  </body>
</html>
